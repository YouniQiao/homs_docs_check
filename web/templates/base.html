<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if module %}{{ module.icon }} {{ module.name }} · {% endif %}OpenHarmony 文档检查</title>
    <style>
        :root {
            --bg: #f4f6fb; --card: #fff; --text: #1f2430; --muted: #667085;
            --border: #e7eaf1; --primary: #2f54d0; --primary-soft: #eef2fe;
            --added: #128c4a; --modified: #c2570a; --deleted: #d13438;
            --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Microsoft YaHei", Roboto, sans-serif;
               background: var(--bg); color: var(--text);
               line-height: 1.65; -webkit-font-smoothing: antialiased; }
        /* 顶栏：深色背景，吸底悬停 */
        .topnav { background: linear-gradient(90deg, #24357d, #2f54d0);
                  padding: 0 28px; display: flex; align-items: center;
                  flex-wrap: wrap; position: sticky; top: 0; z-index: 20;
                  box-shadow: 0 2px 8px rgba(36,53,125,.18); }
        .topnav a { color: rgba(255,255,255,.85); text-decoration: none; padding: 15px 18px;
                    font-size: 14px; display: inline-block; transition: color .15s; }
        .topnav a:hover { color: #fff; }
        .topnav a.active { color: #fff; font-weight: 600;
                           box-shadow: inset 0 -2px 0 #fff; }
        .topnav .brand { font-weight: 700; font-size: 15px; color: #fff;
                         margin-right: 8px; letter-spacing: .2px;
                         padding: 15px 18px 15px 0; }
        .topnav .right { margin-left: auto; }
        .topnav .right + .right { margin-left: 8px; }
        .container { max-width: 1180px; margin: 0 auto; padding: 32px 28px 48px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -.3px; margin-bottom: 6px; }
        .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
        .stats { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
        .stat-card { background: var(--card); border: 1px solid var(--border);
                     border-radius: var(--radius); padding: 18px 26px;
                     box-shadow: var(--shadow); text-align: center; }
        .stat-card .num { font-size: 28px; font-weight: 700; color: var(--primary); }
        .stat-card .label { font-size: 13px; color: var(--muted); }
        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                 gap: 16px; }
        .card { background: var(--card); border: 1px solid var(--border);
                border-radius: var(--radius); padding: 26px 24px;
                box-shadow: var(--shadow); text-decoration: none; color: var(--text);
                display: block; transition: box-shadow .18s, transform .18s, border-color .18s; }
        .card:hover { box-shadow: 0 8px 24px rgba(16,24,40,.10); transform: translateY(-2px);
                      border-color: #d4ddf3; }
        .card .icon { font-size: 30px; margin-bottom: 14px; }
        .card .name { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
        .card .desc { font-size: 13px; color: var(--muted); }
        table { width: 100%; border-collapse: separate; border-spacing: 0;
                background: var(--card); border: 1px solid var(--border);
                border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
        th, td { padding: 11px 16px; text-align: left; border-bottom: 1px solid var(--border);
                 font-size: 13px; }
        th { background: #f7f9fc; font-weight: 600; color: #41485c; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #f8fafd; }
        a { color: var(--primary); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .badge { display: inline-block; padding: 2px 9px; border-radius: 999px;
                 font-size: 12px; font-weight: 600; white-space: nowrap; }
        .badge-added, .badge-success { background: #e5f6ec; color: var(--added); }
        .badge-modified { background: #fdf0e3; color: var(--modified); }
        .badge-deleted, .badge-failed { background: #fdeaea; color: var(--deleted); }
        .badge-info, .badge-running { background: var(--primary-soft); color: var(--primary); }
        .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", monospace; font-size: 12px; }
        .empty { text-align: center; color: var(--muted); padding: 40px; }
        .back { display: inline-block; margin-bottom: 16px; font-size: 13px; }
        .detail-summary { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
        .thumb { max-width: 180px; max-height: 120px; object-fit: contain;
                 border: 1px solid var(--border); border-radius: 8px;
                 background: #fafbfc; }
        .thumb:hover { box-shadow: 0 3px 10px rgba(0,0,0,.12); }
        .btn-link { display: inline-block; padding: 5px 14px;
                    background: var(--primary); color: #fff !important;
                    border-radius: 7px; font-size: 12px; text-decoration: none;
                    white-space: nowrap; }
        .btn-link:hover { opacity: .9; text-decoration: none; }
        .filters { display: flex; gap: 10px; align-items: center; margin-bottom: 18px;
                   background: var(--card); padding: 12px 16px; border: 1px solid var(--border);
                   border-radius: var(--radius); box-shadow: var(--shadow); flex-wrap: wrap; }
        .filters label { font-size: 13px; color: var(--muted); }
        .filters select { padding: 5px 10px; border: 1px solid var(--border);
                           border-radius: 7px; font-size: 13px; background: #fff; }
        .filter-count { margin-left: auto; font-size: 13px; color: var(--muted); }
        .cn-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
                    gap: 12px; margin-bottom: 24px; }
        .cn-card { display: flex; gap: 12px; background: var(--card); border: 1px solid var(--border);
                   padding: 12px; border-radius: var(--radius); box-shadow: var(--shadow); }
        .cn-card .thumb { max-width: 140px; max-height: 100px; }
        .cn-info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
        .cn-meta { display: flex; gap: 8px; align-items: center; margin-top: auto; }
        .cn-tag { font-size: 11px; color: var(--muted); background: #f0f2f7;
                  padding: 2px 8px; border-radius: 6px; }
        .link-item { margin-bottom: 2px; }
        .issue-link { color: var(--deleted); font-size: 12px; text-decoration: none;
                      border-bottom: 1px dashed var(--deleted); word-break: break-all; }
        .issue-link:hover { text-decoration: underline; }
        .link-more { font-size: 12px; color: var(--muted); }
        .filter-input { padding: 6px 10px; border: 1px solid var(--border);
                        border-radius: 7px; font-size: 13px; width: 220px; }
        .filter-input:focus { outline: none; border-color: var(--primary);
                              box-shadow: 0 0 0 3px rgba(47,84,208,.12); }
        .filter-apply { padding: 5px 14px; border: 1px solid var(--border);
                        background: #fff; border-radius: 7px; font-size: 13px;
                        cursor: pointer; }
        .filter-apply:hover { background: var(--primary); color: #fff;
                              border-color: var(--primary); }
        .btn-export { display: inline-block; padding: 5px 14px;
                      background: var(--added); color: #fff; border-radius: 7px;
                      font-size: 13px; text-decoration: none; margin-left: 4px; }
        .btn-export:hover { text-decoration: none; opacity: .9; }
        .pagination { display: flex; align-items: center; gap: 12px;
                      justify-content: center; margin: 20px 0 6px; }
        .pg-btn { padding: 5px 15px; border: 1px solid var(--border);
                  border-radius: 7px; font-size: 13px; text-decoration: none;
                  background: #fff; color: var(--text); }
        .pg-btn:hover { background: var(--primary); color: #fff;
                        border-color: var(--primary); text-decoration: none; }
        .pg-info { font-size: 13px; color: var(--muted); }
        .sched { margin-top: 32px; }
        .sched h2 { font-size: 17px; margin-bottom: 14px; }
        .ocr-text { font-family: ui-monospace, "SF Mono", "Cascadia Mono", monospace;
                    font-size: 12px; white-space: pre-wrap; word-break: break-all;
                    display: inline-block; max-width: 560px; }
        mark { background: #fff4b8; color: #333; padding: 0 2px; border-radius: 2px; }
    </style>
</head>
<body>
    <nav class="topnav">
        <span class="brand">OpenHarmony 文档检查</span>
        <a href="/" class="{{ 'active' if request.path == '/' else '' }}">🏠 首页</a>
        {% for m in nav_modules %}
        <a href="/{{ m.key }}/" class="{{ 'active' if module and module.key == m.key else '' }}">
            {{ m.icon }} {{ m.name }}
        </a>
        {% endfor %}
        <a class="right {{ 'active' if request.path.startswith('/subscribe') else '' }}" href="/subscribe">📬 邮件订阅</a>
        <a class="right {{ 'active' if request.path.startswith('/feedback') else '' }}" href="/feedback">💬 问题反馈</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
