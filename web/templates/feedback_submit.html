{% extends "base.html" %}
{% block content %}
<h1>💬 问题反馈</h1>
<p class="subtitle">遇到问题或有建议？提交给我们，我们会尽快跟进。
    <a href="/feedback/list">→ 查看已有反馈</a></p>

{% if msg %}
<div style="padding:12px 16px;border-radius:8px;background:#e6f7eb;color:var(--added);margin-bottom:16px;font-size:14px;">{{ msg }}</div>
{% endif %}

<form method="post" style="background:var(--card);padding:24px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);max-width:640px;">
    <div style="margin-bottom:16px;">
        <label style="display:block;margin-bottom:6px;font-size:14px;font-weight:600;">反馈内容 <span style="color:var(--deleted)">*</span></label>
        <textarea name="content" rows="5" required
            style="width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;resize:vertical;"
            placeholder="请描述你遇到的问题或建议…"></textarea>
    </div>
    <div style="margin-bottom:20px;">
        <label style="display:block;margin-bottom:6px;font-size:14px;font-weight:600;">联系方式（选填）</label>
        <input type="text" name="contact"
            style="width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font-size:14px;"
            placeholder="邮箱 / 手机号 / 昵称等">
    </div>
    <button type="submit"
        style="padding:10px 28px;background:var(--primary);color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer;">提交反馈</button>
</form>
{% endblock %}
